name: Construction Android (EAS)

# Lancement à la main : GitHub → Actions → « Construction Android (EAS) » → Run workflow.
# La construction elle-même tourne chez Expo (EAS Build) : ce workflow ne fait que la demander,
# puis rend la main (--no-wait). Le lien de suivi et de téléchargement s'affiche dans le journal
# et sur expo.dev. Mise en place : docs/ANDROID_BUILD.md.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "preview = APK à installer directement ; production = AAB pour le Play Store"
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  group: android-build-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS Build Android (${{ inputs.profile }})
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
    steps:
      - name: Vérifier la configuration
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret EXPO_TOKEN manquant (Settings → Secrets and variables → Actions). Voir docs/ANDROID_BUILD.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Demander la construction
        run: eas build --platform android --profile "${{ inputs.profile }}" --non-interactive --no-wait
